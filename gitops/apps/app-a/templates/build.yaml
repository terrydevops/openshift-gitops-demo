{{- if .Values.build.enabled }}
# ─────────────────────────────────────────────────────────────
# S2I build (for a self-contained demo). NOTE: in strict GitOps the build belongs to CI.
# Prefer build.enabled=false and have Tekton/CI produce the image, with Helm only deploying
# it via image.tag.
# ─────────────────────────────────────────────────────────────
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .Values.app.name }}
  labels: {{- include "app-a.labels" . | nindent 4 }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .Values.app.name }}
  labels: {{- include "app-a.labels" . | nindent 4 }}
spec:
  source:
    type: Git
    git: { uri: {{ .Values.build.gitUri }} }
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        namespace: openshift
        name: {{ .Values.build.builderImage }}
  output:
    to: { kind: ImageStreamTag, name: {{ .Values.app.name }}:latest }
  triggers:
  - type: ConfigChange
  - type: ImageChange
{{- end }}
