# ─────────────────────────────────────────────────────────────
# Database = CloudNativePG Cluster CR (namespaced; the app team can create it).
# The CNPG operator reconciles this into: a primary/replica set, a generated
# connection Secret <name>-app, services <name>-rw (primary) / <name>-ro (read-only),
# plus backups and automatic failover.
# ─────────────────────────────────────────────────────────────
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.db.name }}
  labels: {{- include "app-a.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.db.instances }}     # 1 = single instance; >=3 = HA primary/replica
  bootstrap:
    initdb:
      database: {{ .Values.db.database }}    # initial database name
      owner: {{ .Values.db.owner }}          # application user (password generated by CNPG)
  storage:
    size: {{ .Values.db.storage.size }}
    {{- with .Values.db.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources: {{- toYaml .Values.db.resources | nindent 4 }}
